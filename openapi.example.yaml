openapi: 3.0.0
info:
  title: Fixture Payments API
  version: "1.0"
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          description: ok
  /api/payments:
    post:
      operationId: createPayment
      security:
        - bearerAuth: []
      responses:
        "201":
          description: created
  /api/payments/{id}:
    get:
      operationId: getPayment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
