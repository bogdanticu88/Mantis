id: default-api-key-check
info:
  name: API Endpoint Responds to Default or Test API Keys
  severity: high
  tags: [api-key, default-credentials, authentication, auth-jwt-misconfig]
  description: "Tests whether API endpoints return data when called with well-known default or placeholder API keys, indicating that authentication is absent or that default keys have not been rotated."
  remediation: "Require valid, user-provisioned API keys for all endpoints. Return HTTP 401 for any missing or unrecognized key. Enforce key rotation policies."
  cwe: "CWE-798"
  owasp: "A07:2021-Identification and Authentication Failures"

payloads:
  apikey: ["test", "demo", "changeme", "admin", "secret", "12345", "apikey", "default", "letmein", "password"]

requests:
  - method: GET
    paths:
      - /api/v1/status
      - /api/v1/users
      - /api/status
      - /api/v1/user
    headers:
      X-API-Key: "{{apikey}}"

    matchers-condition: and
    matchers:
      - type: status
        status: [200, 201]
      - type: word
        words: ["Unauthorized", "Forbidden", "invalid", "Invalid", "denied", "401", "403"]
        part: body
        condition: or
        negative: true
      - type: dsl
        dsl: "content_length > 50"
