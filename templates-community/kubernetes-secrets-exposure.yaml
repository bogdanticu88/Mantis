id: kubernetes-secrets-exposure
info:
  name: Kubernetes Secrets API or Admin Kubeconfig Exposed
  severity: critical
  tags: [cloud, kubernetes, k8s, secrets, misconfiguration, cloud-infrastructure]
  description: "The Kubernetes secrets API endpoint or admin kubeconfig file is accessible without authentication. This exposes service account tokens, TLS certificates, and all application credentials stored as cluster secrets."
  remediation: "Enforce Kubernetes RBAC and require authentication on all API server endpoints. Never expose the kube API server directly to the internet. Restrict filesystem access to kubeconfig files to root only."
  cwe: "CWE-200"
  owasp: "A05:2021-Security Misconfiguration"

requests:
  - method: GET
    paths:
      - /api/v1/secrets
      - /api/v1/namespaces/default/secrets
      - /etc/kubernetes/admin.conf
      - /root/.kube/config
      - /.kube/config
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["apiVersion"]
        part: body
      - type: word
        words: ["Secret", "token", "certificate-authority", "client-key-data"]
        part: body
        condition: or
