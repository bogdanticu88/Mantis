id: wordpress-config-backup
info:
  name: WordPress Configuration Backup File Exposed
  severity: critical
  tags: [wordpress, config, backup, credentials, cms, info-disclosure]
  description: "A backup copy of wp-config.php is publicly accessible. This file contains database credentials, secret keys, and other sensitive configuration that provides full site compromise."
  remediation: "Remove all backup copies of wp-config.php from the webroot. Restrict access to configuration files at the web server level."
  cwe: "CWE-530"
  owasp: "A05:2021-Security Misconfiguration"

requests:
  - method: GET
    paths:
      - /wp-config.php.bak
      - /wp-config.php~
      - /wp-config.bak
      - /wp-config.php.old
      - /wp-config.php.orig
      - /wp-config.php.save
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["DB_NAME", "DB_PASSWORD", "DB_HOST", "AUTH_KEY"]
        part: body
        condition: or
