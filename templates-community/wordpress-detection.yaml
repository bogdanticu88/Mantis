id: wordpress-detection
info:
  name: WordPress Installation Detected
  severity: info
  tags: [tech, fingerprint, wordpress, cms]
  description: "WordPress is running on this host. Knowing the CMS enables targeted plugin/theme CVE enumeration."
  remediation: "Keep WordPress core, themes, and plugins up to date. Block direct access to xmlrpc.php and wp-json if not required."
  cwe: "CWE-200"
  owasp: "A05:2021-Security Misconfiguration"

requests:
  - method: GET
    path: /wp-login.php
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["wp-login", "WordPress"]
        condition: or
