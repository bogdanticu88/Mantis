id: htpasswd-exposure
info:
  name: "HTTP Basic Auth Password File Exposure"
  severity: high
  tags: [htpasswd, apache, nginx, credentials, hashes, exposure, config-file-exposures]
  description: "Detects publicly accessible .htpasswd files containing hashed HTTP Basic Authentication credentials. Exposed hashes are subject to offline cracking, particularly MD5-crypt and DES-crypt variants."
  remediation: "Move .htpasswd above the web root or restrict access via web server Deny rules. Invalidate and reissue credentials for any accounts stored in an exposed file."
  cwe: "CWE-522"
  owasp: "A07:2021-Identification and Authentication Failures"

requests:
  - method: GET
    paths:
      - /.htpasswd
      - /admin/.htpasswd
      - /.htpasswd.bak
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "$apr1$"
          - "{SHA}"
          - "$2y$"
          - "$2a$"
        part: body
        condition: or
