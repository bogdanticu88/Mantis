id: ssrf-aws-imds-probe
info:
  name: Possible SSRF to AWS Instance Metadata Service
  severity: high
  tags: [ssrf, injection, aws, cloud]
  description: "A URL-fetching parameter accepted the AWS instance metadata address and the response appears to contain metadata content. This template uses a generic 'url' parameter name — adapt the path/parameter to the target application's actual URL-fetching endpoint for real coverage. AWS IMDSv1 has no header requirement, so a successful blind fetch is sufficient; if the target enforces IMDSv2 (session-token-gated), this probe alone will not reach it."
  remediation: "Block outbound requests to link-local/metadata addresses (169.254.169.254) from server-side request paths; enforce IMDSv2 on the instance; use an allowlist of permitted destination hosts."
  cwe: "CWE-918"
  owasp: "A10:2021-Server-Side Request Forgery"

requests:
  - method: GET
    path: "/?url=http://169.254.169.254/latest/meta-data/"
    matchers:
      - type: word
        words: ["ami-id", "instance-id", "iam/security-credentials"]
        condition: or
