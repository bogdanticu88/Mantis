id: password-reset-host-header
info:
  name: Password Reset Link Reflects Injected Host Header
  severity: high
  tags: [host-header, password-reset, account-takeover, authentication, auth-jwt-misconfig]
  description: "Tests whether the password reset endpoint builds the reset link from the request Host header. An attacker who controls the Host header can redirect the reset token to their server, enabling account takeover."
  remediation: "Generate password reset URLs from a hardcoded base URL stored in application configuration. Never derive the reset link hostname from the incoming request's Host header."
  cwe: "CWE-640"
  owasp: "A07:2021-Identification and Authentication Failures"

requests:
  - method: POST
    paths:
      - /reset-password
      - /forgot-password
      - /api/reset-password
      - /api/forgot-password
      - /auth/reset-password
      - /password/reset
      - /account/forgot-password
    headers:
      Host: "evil.com"
      Content-Type: "application/json"
    body: '{"email":"test@example.com"}'

    matchers-condition: or
    matchers:
      - type: word
        words: ["evil.com"]
        part: body
      - type: regex
        regex: ["https?://evil\\.com"]
        part: body
      - type: regex
        regex: ["https?://evil\\.com"]
        part: header
