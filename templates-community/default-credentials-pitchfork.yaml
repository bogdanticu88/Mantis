id: default-credentials-pitchfork
info:
  name: Default Credentials – Common Pairs (Pitchfork)
  severity: critical
  tags: [default-creds, auth, brute]
  description: "A commonly-used default credential pair was accepted by the login endpoint, indicating the application ships with or was deployed with well-known passwords that any attacker can try."
  remediation: "Force a password change on first login. Remove or disable any default accounts before production deployment. Enforce a minimum password complexity policy and lock accounts after repeated failures."
  cwe: "CWE-1392"
  owasp: "A07:2021-Identification and Authentication Failures"

attack: pitchfork

payloads:
  username:
    - admin
    - administrator
    - root
    - user
    - test
    - guest
    - operator
    - sa
  password:
    - admin
    - administrator
    - root
    - password
    - test
    - guest
    - 1234
    - ""

requests:
  - method: POST
    path: /api/login
    headers:
      Content-Type: application/json
    body: '{"username":"{{username}}","password":"{{password}}"}'
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["token", "access_token", "sessionId", "session_id", "\"authenticated\":true"]
        condition: or
