id: crlf-injection-header-splitting
info:
  name: CRLF Injection / HTTP Response Splitting
  severity: high
  tags: [crlf, injection]
  description: "A CRLF sequence in the request path was reflected into the response as a new header, indicating the application is vulnerable to HTTP response splitting."
  remediation: "Strip or encode CR/LF characters from any user input reflected into response headers."
  cwe: "CWE-93"
  owasp: "A03:2021-Injection"

requests:
  - method: GET
    path: "/%0d%0aX-Mantis-Injected:%20crlf-poc"
    matchers:
      - type: dsl
        dsl: "header('X-Mantis-Injected') == 'crlf-poc'"
