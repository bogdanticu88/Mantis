id: rails-secret-key-exposure
info:
  name: Rails Development Info Page Exposed
  severity: high
  tags: [rails, ruby, info-disclosure, debug, framework]
  description: "The Rails /rails/info/properties endpoint is accessible, exposing application properties including Ruby version, Rails version, environment, and potentially application secrets."
  remediation: "Ensure RAILS_ENV is set to production in deployed applications. The info/properties endpoint is only available in development mode by default."
  cwe: "CWE-200"
  owasp: "A05:2021-Security Misconfiguration"

requests:
  - method: GET
    paths:
      - /rails/info/properties
      - /rails/info
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["Rails version", "Ruby version", "RubyGems version"]
        part: body
        condition: or
