id: aws-credentials-exposure
info:
  name: "AWS Credentials File Exposure"
  severity: critical
  tags: [aws, cloud, credentials, access-key, exposure, config-file-exposures]
  description: "Detects publicly accessible AWS credentials files or JSON blobs containing access keys. Exposed keys allow an attacker to authenticate to AWS and access any permitted service."
  remediation: "Remove credentials files from the web root immediately. Rotate exposed keys via IAM. Replace long-lived access keys with IAM roles for EC2 instances and container workloads."
  cwe: "CWE-312"
  owasp: "A02:2021-Cryptographic Failures"

requests:
  - method: GET
    paths:
      - /.aws/credentials
      - /.aws/config
      - /aws.json
      - /credentials.json
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "aws_access_key_id"
          - "aws_secret_access_key"
          - "AWS_ACCESS_KEY"
        part: body
        condition: or
