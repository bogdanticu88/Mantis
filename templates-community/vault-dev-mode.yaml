id: vault-dev-mode
info:
  name: "HashiCorp Vault Dev Mode - Default Root Token"
  severity: critical
  tags: [vault, hashicorp, default-credentials-extended, misconfig, secrets-manager]
  description: "Vault is running in dev mode. The well-known root token grants unrestricted administrative access to all secrets, policies, and auth methods without authentication."
  remediation: "Never run Vault in dev mode outside of local development. Initialize Vault with proper unseal keys, enforce least-privilege token policies, and use TLS."
  cwe: "CWE-798"
  owasp: "A05:2021-Security Misconfiguration"

requests:
  - method: GET
    path: /v1/sys/health
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ['"sealed":false', '"initialized":true']
        part: body
        condition: and

  - method: GET
    path: /v1/sys/mounts
    headers:
      X-Vault-Token: "root"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["cubbyhole/", "identity/", "sys/"]
        part: body
        condition: or
