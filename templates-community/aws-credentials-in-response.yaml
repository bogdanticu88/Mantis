id: aws-credentials-in-response
info:
  name: AWS Access Key ID Exposed in HTTP Response
  severity: critical
  tags: [cloud, aws, credentials, secrets, leak, cloud-infrastructure]
  description: "An AWS access key ID matching the AKIA pattern was found in an HTTP response body. Exposed credentials allow unauthorized API access to AWS resources under the associated IAM identity."
  remediation: "Rotate the exposed key immediately via the IAM console and revoke all active sessions. Remove static credentials from application responses and migrate to IAM roles or AWS Secrets Manager."
  cwe: "CWE-312"
  owasp: "A02:2021-Cryptographic Failures"

requests:
  - method: GET
    paths:
      - /
      - /.env
      - /config
      - /api/config
      - /debug
      - /status
      - /health
      - /info
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["AKIA[0-9A-Z]{16}"]
        part: body
