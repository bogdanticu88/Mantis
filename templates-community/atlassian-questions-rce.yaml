id: atlassian-questions-rce
info:
  name: Atlassian Jira/Confluence Plugin Setting Exposure
  severity: high
  tags: [cves-rce-critical, atlassian, jira, confluence, plugin, exposure]
  description: "Detects unauthenticated access to the Atlassian Questions plugin REST endpoint, which may expose internal configuration and plugin settings. In certain versions, chained with other CVEs, this enables RCE."
  remediation: "Restrict the /rest/api/1.0/pluginSetting.json endpoint to authenticated users. Upgrade Jira and Confluence to the latest patched versions. Review plugin configurations for sensitive data exposure."
  cwe: "CWE-284"
  owasp: "A01:2021-Broken Access Control"

requests:
  - method: GET
    paths:
      - "/rest/api/1.0/pluginSetting.json"
      - "/rest/com.atlassian.plugins.atlassian-connect-plugin:confluence-router/1.0/"
      - "/rest/api/1.0/mail/1"
      - "/s/com.atlassian.jira.collector.plugin.jira-issue-collector-plugin:issuecollector-embededjs"
    stop-at-first-match: false

    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words:
          - "pluginKey"
          - "pluginSetting"
          - "atlassian"
          - "jira"
          - "confluence"
        part: body
        condition: or
      - type: word
        words:
          - "application/json"
        part: header
