id: solr-admin-open
info:
  name: "Apache Solr Admin API Unauthenticated Access"
  severity: high
  tags: [solr, apache, default-credentials-extended, misconfig, search]
  description: "The Solr admin API is accessible without authentication, exposing core configuration, schema details, JVM metrics, and administrative operations including core unload and reload."
  remediation: "Enable Solr authentication using BasicAuthPlugin or Kerberos. Set SOLR_SECURITY_MANAGER_ENABLED=true. Restrict network access to the admin interface."
  cwe: "CWE-306"
  owasp: "A05:2021-Security Misconfiguration"

requests:
  - method: GET
    paths:
      - /solr/admin/cores?action=STATUS
      - /solr/admin/info/system
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["responseHeader", "solr-spec-version", "lucene-spec-version", "jvm"]
        part: body
        condition: or
      - type: dsl
        dsl: "content_length > 200"
