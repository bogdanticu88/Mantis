id: gcp-service-account-key
info:
  name: GCP Service Account Key Exposed in HTTP Response
  severity: critical
  tags: [cloud, gcp, credentials, service-account, secrets, cloud-infrastructure]
  description: "A GCP service account key JSON structure was detected in an HTTP response. This grants full authenticated access to GCP APIs under the service account's IAM permissions."
  remediation: "Delete the exposed service account key in the GCP console immediately. Store credentials in Secret Manager and switch to workload identity federation for GKE or Compute Engine workloads."
  cwe: "CWE-312"
  owasp: "A02:2021-Cryptographic Failures"

requests:
  - method: GET
    paths:
      - /
      - /.env
      - /config
      - /credentials.json
      - /service-account.json
      - /sa-key.json
      - /api/config
      - /static/credentials.json
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["\"type\":\\s*\"service_account\""]
        part: body
      - type: word
        words: ["private_key_id", "client_email"]
        part: body
        condition: or
