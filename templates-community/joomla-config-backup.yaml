id: joomla-config-backup
info:
  name: Joomla Configuration Backup File Exposed
  severity: critical
  tags: [joomla, cms, backup, credentials, disclosure, database]
  description: "Joomla configuration backup files are publicly accessible. These files contain database credentials, secret keys, and FTP passwords in plaintext, enabling full database and site compromise."
  remediation: "Delete all backup configuration files from the web root immediately. Implement web server deny rules for .bak, .old, .orig, and .save extensions."
  cwe: "CWE-530"
  owasp: "A02:2021-Cryptographic Failures"

requests:
  - method: GET
    paths:
      - /configuration.php.bak
      - /configuration.php.old
      - /configuration.php~
      - /configuration.php.orig
      - /configuration.php.save
      - /configuration.php_bak
      - /configuration.bak
      - /configuration.old

    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["JConfig", "$password", "$secret", "$db", "var $"]
        part: body
        condition: or
      - type: regex
        regex: ['\$password\s*=', '\$secret\s*=', '\$db\s*=']
        part: body
        condition: or
